[package]
name = "uebox-tauri"
version = "1.0.12"
edition = "2021"
publish = false

[lib]
name = "uebox_tauri_lib"
crate-type = ["lib"]

[[example]]
name = "unreal_ui_harness"
required-features = ["unreal"]

[[example]]
name = "godot_agent_ui_harness"
required-features = ["godot"]

[[example]]
name = "godot_editor_fixture"
required-features = ["godot"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
uebox-credentials = { path = "../crates/uebox-credentials" }
uebox-chat-history = { path = "../crates/uebox-chat-history" }
uebox-legacy-history = { path = "../crates/uebox-legacy-history" }
uebox-project-library = { path = "../crates/uebox-project-library" }
uebox-project-collections = { path = "../crates/uebox-project-collections" }
uebox-notes = { path = "../crates/uebox-notes" }
uebox-mcp-client = { path = "../crates/uebox-mcp-client" }
uebox-asset-index = { path = "../crates/uebox-asset-index" }
uebox-engine-unity = { path = "../crates/uebox-engine-unity", optional = true }
uebox-engine-unreal = { path = "../crates/uebox-engine-unreal", optional = true }
uebox-godot-session = { path = "../crates/uebox-godot-session", optional = true }
uebox-engine-core = { path = "../crates/uebox-engine-core", optional = true }
uebox-agent-core = { path = "../crates/uebox-agent-core", optional = true }
uebox-agent-engine-tools = { path = "../crates/uebox-agent-engine-tools", optional = true, default-features = false }
uebox-agent-unity-tools = { path = "../crates/uebox-agent-unity-tools", optional = true }
uebox-agent-godot-tools = { path = "../crates/uebox-agent-godot-tools", optional = true }
getrandom = "0.2"
sha2 = "0.11"
url = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "sync"], optional = true }
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
uebox-cli = { path = "../crates/uebox-cli", optional = true }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.26"

[features]
default = ["unity", "unreal", "godot"]
unity = ["dep:uebox-cli", "dep:uebox-engine-unity", "dep:uebox-engine-core", "dep:uebox-agent-core", "dep:uebox-agent-unity-tools", "dep:tokio"]
unreal = ["dep:uebox-cli", "dep:uebox-engine-unreal", "dep:uebox-engine-core", "dep:uebox-agent-core", "uebox-agent-engine-tools/unreal", "dep:tokio"]
godot = ["dep:uebox-cli", "dep:uebox-godot-session", "dep:uebox-engine-core", "dep:uebox-agent-core", "dep:uebox-agent-godot-tools", "dep:tokio"]
godot-real-editor-test = ["godot"]
custom-protocol = ["tauri/custom-protocol"]
