[package]
name = "uebox-agent-engine-tools"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
uebox-agent-core = { path = "../uebox-agent-core", optional = true }
uebox-engine-core = { path = "../uebox-engine-core", optional = true }
uebox-engine-unreal = { path = "../uebox-engine-unreal", optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
default = ["unreal"]
unreal = ["dep:uebox-agent-core", "dep:uebox-engine-core", "dep:uebox-engine-unreal", "dep:serde_json", "dep:tokio"]

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.26"
