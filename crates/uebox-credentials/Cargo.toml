[package]
name = "uebox-credentials"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
